[project]
name = "wake-ai"
version = "0.1.0"
description = "Wake.ai — the cleanup crew for your code"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "docker>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "vulture>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["control_plane*"]
